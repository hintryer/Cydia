<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <title>我的仓库</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="repo-header">
      <div class="container">
        <div class="d-flex align-items-center">
          <img src="CydiaIcon.png" alt="Repository Icon" />
          <h1>我的仓库</h1>
        </div>
      </div>
    </div>

    <div class="container mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title mb-3">欢迎使用我的仓库</h5>
          <p class="card-text mb-4">
            这是一个由社区维护的 APT 仓库模板，适合展示和分发软件包。
          </p>
          <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-primary" href="sileo://source/https://hintryer.github.io/Cydia/"
              >添加到 Sileo</a
            >
            <a
              class="btn btn-primary"
              href="zbra://sources/add/https://hintryer.github.io/Cydia/"
              >添加到 Zebra</a
            >
            <a class="btn btn-primary" href="apt-repo://https://hintryer.github.io/Cydia/"
              >添加到 Saily</a
            >
            <a
              class="btn btn-primary"
              href="cydia://url/https://cydia.saurik.com/api/share#?source=https://hintryer.github.io/Cydia/"
              >添加到 Cydia</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <h2 class="section-title">推荐软件包</h2>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">旧版软件包</div>
            <div class="card-body">
              <p class="card-text">
                这是一个信息较少的示例软件包，适合展示旧版软件包的说明。
              </p>
              <a
                class="btn btn-primary"
                href="depictions/web/?p=com.example.oldsample"
                >查看更多</a
              >
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">新版软件包</div>
            <div class="card-body">
              <p class="card-text">
                这是一个包含较多详细信息的示例软件包。
              </p>
              <a
                class="btn btn-primary"
                href="depictions/web/?p=com.example.newsample"
                >查看更多</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
